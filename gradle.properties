org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Version of the LiteRT-LM Android runtime (Google AI Edge).
# "latest.release" follows the official docs and always resolves to the newest release.
# For reproducible builds, pin a concrete version from Google Maven instead, e.g. litertlmVersion=0.18.1
# (0.17.x and 0.18.x need Kotlin 2.3 or newer, which this project already uses).
litertlmVersion=latest.release
